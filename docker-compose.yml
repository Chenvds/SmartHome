version: '3.8'

services:
  backend:
    build: ./back
    container_name: smarthome-backend
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: smarthome-frontend
    ports:
      - "8080:80"
    volumes:
      - ./front/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
